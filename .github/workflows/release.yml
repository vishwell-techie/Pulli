# Pushing a tag such as v0.1.0 builds the firmware and the example games and
# attaches them to a GitHub release. The checks have already passed on main:
# a tag is only ever put on a commit that is there.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Only the owner publishes releases. Anyone with write access can push a
    # tag, and this job holds permission to create releases, so it ignores
    # tags pushed by anyone else. Branch rules would also stop the push, but
    # they are only enforced on a paid plan or a public repository.
    if: github.actor == 'vishwell-techie'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build python3 libsdl2-dev gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Test
        run: |
          cmake -S . -B build -G Ninja
          ninja -C build
          cd build && ctest --output-on-failure
      - name: Firmware
        run: |
          cmake -S firmware -B firmware/build -G Ninja
          ninja -C firmware/build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Songs are kept as .json; their WAVs are made, never committed.
      - name: Make the songs' WAVs
        run: for game in examples/*/; do [ -d "$game/music" ] && node tools/pattarai/make-wavs.mjs "$game"; done; true
      - name: Gather the files
        run: |
          mkdir -p dist
          cp firmware/build/pulli.uf2 dist/
          cp LICENSE NOTICE dist/
          cp third_party/noto-sans-tamil/OFL.txt dist/OFL-NotoSansTamil.txt   # the firmware carries this font
          for game in examples/*/; do python3 tools/pulli.py pack "$game" "dist/$(basename "$game").pulli"; done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
